name: Publish Linux repositories

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published application version (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-packages-push
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a token for TheCoolRaven
        id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.THECOOLRAVEN_APP_ID }}
          private-key: ${{ secrets.THECOOLRAVEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: linux-packages
      - name: Check out package repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Vapourware-Studios/linux-packages
          ref: main
          token: ${{ steps.bot.outputs.token }}
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev rpm createrepo-c pacman-package-manager libarchive-tools zstd gnupg dnf dnf-plugins-core
      - name: Verify signatures and native package-manager downloads
        run: python3 -m unittest discover -s test -v
      - name: Sign and publish with TheCoolRaven
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ inputs.version }}
          LINUX_PACKAGE_SIGNING_KEY: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LINUX_PACKAGE_SIGNING_KEY"
          export GNUPGHOME="$RUNNER_TEMP/linux-repo-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$LINUX_PACKAGE_SIGNING_KEY" | gpg --batch --import
          unset LINUX_PACKAGE_SIGNING_KEY
          python3 scripts/publish_repository.py --version "$VERSION" --work-dir "$RUNNER_TEMP/linux-package-work"
      - name: Verify published installations
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ inputs.version }}
        timeout-minutes: 31
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY=Vapourware-Studios/linux-packages
          RUN_ID=$(gh api --method POST "repos/$REPOSITORY/actions/workflows/verify-install.yml/dispatches" \
            -H "X-GitHub-Api-Version: 2026-03-10" -f ref=main -f "inputs[version]=$VERSION" --jq .workflow_run_id)
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "Checking https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          for attempt in {1..90}; do
            RESULT=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" \
              --jq 'if .status == "completed" then .conclusion else "pending" end')
            case "$RESULT" in
              success) exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::Published installation checks finished with $RESULT"; exit 1 ;;
            esac
          done
          echo "::error::Published installation checks timed out"
          exit 1
