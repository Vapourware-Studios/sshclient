name: Release

# Builds automatically when package.json changes on main,
# or manually through the GitHub Actions interface.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check-version:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Check package version
        id: check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          # Manual runs always proceed with a build.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(node -p "require('./package.json').version")
          BEFORE="${{ github.event.before }}"

          # Compare against the repository state before the entire push.
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            PREVIOUS=""
          else
            PREVIOUS=$(
              git show "${BEFORE}:package.json" 2>/dev/null |
                node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" \
                2>/dev/null || true
            )
          fi

          echo "Current version:  $CURRENT"
          echo "Previous version: $PREVIOUS"

          if [[ "$CURRENT" != "$PREVIOUS" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Overlapping runs (a push plus a manual run) would share one draft,
      # and the faster one could publish it while the slower one is still
      # uploading. Each run waits for every older Release run to finish
      # first; unlike a concurrency group, this never drops a queued run.
      - name: Wait for earlier release runs
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          while true; do
            OLDER=$(
              gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?per_page=100" \
                --jq "[.workflow_runs[] | select(.status != \"completed\" and .id < ${{ github.run_id }}) | .id] | join(\" \")"
            )

            if [[ -z "$OLDER" ]]; then
              break
            fi

            echo "Waiting for earlier release runs to finish: $OLDER"
            sleep 30
          done

      # electron-builder publishes each target (e.g. the macOS zip and dmg)
      # concurrently, and when no release exists yet every one of them
      # creates its own draft, splitting the assets across duplicates.
      # Creating the draft up front gives them all one release to find.
      - name: Create draft release
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          EXISTING=$(
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id"
          )

          if [[ -n "$EXISTING" ]]; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes ""

  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: blacksmith-4vcpu-windows-2025
            flag: --win

          - name: macOS
            os: blacksmith-6vcpu-macos-latest
            flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install and verify MSVC Spectre libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $component = "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre"

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          $installer = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\setup.exe"

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found at: $vswhere"
          }

          if (!(Test-Path $installer)) {
            throw "Visual Studio Installer was not found at: $installer"
          }

          # The runner image decides which Visual Studio product and version
          # ships (Build Tools vs Enterprise, 2022 vs 2026), so accept any
          # instance with the C++ toolchain and log what is there.
          Write-Host "Visual Studio instances on this runner:"
          & $vswhere -all -products * -format text |
            Select-String -Pattern '^(displayName|installationPath|installationVersion):'

          $instance = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -format json |
            ConvertFrom-Json |
            Select-Object -First 1

          if (!$instance) {
            throw "No Visual Studio installation with the C++ toolchain was found"
          }

          $installPath = $instance.installationPath.Trim()
          Write-Host "Using $($instance.displayName) at: $installPath"

          function Test-SpectreInstalled {
            $paths = & $vswhere `
              -all `
              -products * `
              -requires $component `
              -property installationPath
            return @($paths | ForEach-Object { $_.Trim() }) -contains $installPath
          }

          if (!(Test-SpectreInstalled)) {
            Write-Host "Installing MSVC Spectre-mitigated libraries..."

            $arguments = @(
              "modify"
              "--installPath"
              "`"$installPath`""
              "--add"
              $component
              "--quiet"
              "--norestart"
            )

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList $arguments `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Installer failed with exit code $($process.ExitCode)"
            }

            if ($process.ExitCode -eq 3010) {
              Write-Host "Visual Studio Installer requested a restart; continuing without restarting."
            }
          }
          else {
            Write-Host "MSVC Spectre libraries are already installed."
          }

          if (!(Test-SpectreInstalled)) {
            throw "MSVC Spectre libraries could not be verified after installation"
          }

          Write-Host "MSVC Spectre libraries verified at: $installPath"

          # Pin node-gyp to the exact instance that has the Spectre libraries
          # (msvs_version accepts an installation path as well as a year).
          "npm_config_msvs_version=$installPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build and publish release
        run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/linux.yml

  # electron-builder uploads macOS and Windows artifacts to a draft release.
  # Publishing that draft before all platforms have uploaded makes the
  # remaining uploads fail silently ("existing type not compatible with
  # publishing type"), so the draft is only published here, after every
  # build job has finished.
  publish:
    name: Publish release
    needs: [build, build-linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download tested Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release-linux

      - name: Upload Linux packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" release-linux/* --clobber

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          RELEASE_ID=$(
            gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id"
          )

          if [[ -z "$RELEASE_ID" ]]; then
            echo "No draft release found for $TAG; nothing to publish."
            exit 0
          fi

          if [[ $(wc -l <<< "$RELEASE_ID") -gt 1 ]]; then
            echo "Found several draft releases for $TAG ($(tr '\n' ' ' <<< "$RELEASE_ID"));"
            echo "merge them into one before publishing."
            exit 1
          fi

          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true

          echo "Published $TAG"

  update-linux-packages:
    needs: [publish, check-version]
    uses: ./.github/workflows/linux-repository.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: homebrew-tap-push

    steps:
      - name: Check out sshclient
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Releases are published by the org's own app rather than by GitHub's
      # generic bot, so the tap's history says who shipped each version. The
      # token is minted per run, reaches the tap and nothing else, and expires
      # an hour later — no long-lived PAT sitting in the secrets.
      - name: Mint a token for TheCoolRaven
        id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.THECOOLRAVEN_APP_ID }}
          private-key: ${{ secrets.THECOOLRAVEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Check out homebrew-tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Vapourware-Studios/homebrew-tap
          token: ${{ steps.bot.outputs.token }}
          path: homebrew-tap

      - name: Update cask
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          CASK="homebrew-tap/Casks/sshclient.rb"

          # The concurrency group only stops two update-tap jobs from running at
          # the same time — it doesn't guarantee they run in version order. A
          # slower older release can finish its build after a newer one and
          # reach this step second, so refuse to overwrite the tap with
          # anything that isn't strictly newer than what's already there.
          TAP_VERSION=$(grep -m1 '^  version "' "$CASK" | sed -E 's/.*"(.*)".*/\1/')
          NEWEST=$(printf '%s\n%s\n' "$TAP_VERSION" "$VERSION" | sort -V | tail -1)
          if [[ "$NEWEST" != "$VERSION" || "$TAP_VERSION" == "$VERSION" ]]; then
            echo "Tap is already at $TAP_VERSION (>= $VERSION); skipping to avoid a rollback."
            echo "SKIP_TAP_UPDATE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          ASSET=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets \
            --jq '.assets[].name | select(test("-arm64\\.dmg$"))')
          if [[ -z "$ASSET" || $(wc -l <<< "$ASSET") -ne 1 ]]; then
            echo "::error::expected exactly one *-arm64.dmg asset on $TAG, found: $ASSET" >&2
            exit 1
          fi

          gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -O "$ASSET"
          SHA256=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)

          sed -i "s/^  version \".*\"/  version \"$VERSION\"/" "$CASK"
          sed -i "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" "$CASK"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.SKIP_TAP_UPDATE != 'true'
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Cask already up to date; nothing to push."
            exit 0
          fi

          git config user.name "thecoolraven[bot]"
          git config user.email "306463211+thecoolraven[bot]@users.noreply.github.com"
          git add Casks/sshclient.rb
          git commit -m "sshclient ${VERSION}"
          git push
