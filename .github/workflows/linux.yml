name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Compile native modules against the same older glibc on both CPUs.
    container:
      image: ubuntu:22.04
      # Let Chromium create its own sandbox inside the build container.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install build and desktop dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential g++-12 python3 rpm libarchive-tools zstd \
            libgtk-3-0 libnss3 libgbm1 libasound2 libsecret-tools udev \
            xvfb xauth dbus-x11
          # Electron's V8 headers need a newer compiler than 22.04's GCC 11.
          # GCC 12 links against the libstdc++ 22.04 already ships, so the
          # glibc and libstdc++ floor stays the same.
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package all Linux formats
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      - name: Test packaged resources with the sandbox enabled
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/electron/install.js
          chown root:root node_modules/electron/dist/chrome-sandbox
          chmod 4755 node_modules/electron/dist/chrome-sandbox
          useradd --create-home demo
          runuser -u demo -- xvfb-run -a dbus-run-session -- \
            node_modules/electron/dist/electron scripts/linux-smoke.cjs \
            release/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/resources/app.asar
      - name: Prepare native packages and checksums
        run: npm run release:linux:checksums -- ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/latest-linux*.yml
            release/SHA256SUMS-linux-*
